services:
  app:
    image: levelup0210/levelup:latest
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATA_MONGODB_URI=mongodb://levelup:levelup0210@mongo:27017/levelup
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_PASSWORD=levelup0210
      - SPRING_ELASTICSEARCH_URIS=http://elasticsearch:9200
      - SPRING_ELASTICSEARCH_USERNAME=elastic
      - SPRING_ELASTICSEARCH_PASSWORD=your-secure-password
    env_file:
      - .env
    ports:
      - "8080:8080"
    networks:
      - app-network
    depends_on:
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    command: ["./wait-for-it.sh", "mysql:3306", "--", "java", "-jar", "app.jar", "--debug"]
  mongo:
    image: mongo:7.0.17-rc1-jammy
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: levelup
      MONGO_INITDB_ROOT_PASSWORD: levelup0210
      MONGO_INITDB_DATABASE: levelup
    volumes:
      - mongodb-data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js
    networks:
      - app-network
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.2
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=your-secure-password
      - xpack.security.authc.api_key.enabled=true
      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    healthcheck:
      test: [ "CMD", "curl", "-u", "elastic:your-secure-password", "-f", "http://localhost:9200" ]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      - app-network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.2
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=j*DqotOY_x+x0aD2H36h
    ports:
      - "5601:5601"
    networks:
      - app-network
    depends_on:
      - elasticsearch

  logstash:
    build:
      context: .
      dockerfile: logstash.Dockerfile
    container_name: logstash
    depends_on:
      - elasticsearch
    networks:
      - app-network
    environment:
      - XPACK_MONITORING_ENABLED=true
      - XPACK_MONITORING_ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - XPACK_MONITORING_ELASTICSEARCH_USERNAME=elastic
      - XPACK_MONITORING_ELASTICSEARCH_PASSWORD=your-secure-password
    volumes:
      - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf

  redis:
    image: redis:latest
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server /usr/local/etc/redis/redis.conf --notify-keyspace-events Ex
    networks:
      - app-network
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
volumes:
  elasticsearch-data:
    driver: local
  redis-data:
    driver: local
  mongodb-data:
    driver: local

networks:
  app-network:
    driver: bridge