<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <title>메인 페이지</title>
    <style>
        /* 간단한 스타일 예시 */
        body {
            margin: 0;
            font-family: sans-serif;
        }
        .logo {
            width: 120px;
        }
        header {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        #categoryContainer {
            margin-top: 20px;
            margin-bottom: 30px;
        }
        .category-item {
            display: inline-block;
            margin-right: 25px;
            vertical-align: top;
            text-align: center;
            border-radius: 10px;
        }
        .category-item img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            display: block;
        }
        .product-item img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            display: block;
        }
        .product-item {
            display: flex;
            padding-bottom: 20px;
            padding-top: 20px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
        }
        .product-left {
            margin-right: 30px;
            border-radius: 10px;
        }
        .product-right strong {
            font-size: 18px;
        }
        .create-product-btn {
            position: fixed;
            bottom: 75px; /* 네비게이션 바(50px) 위에 10px 여유 */
            right: calc((100% - 400px) / 2 + 25px); /* 중앙 컨테이너의 오른쪽 끝에서 10px 안쪽 */
            padding: 10px 20px;
            background-color: #4285F4;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            z-index: 1100; /* 네비게이션보다 위에 표시 */
        }
        /* 필터 버튼 영역 */
        #filterContainer {
            margin-bottom: 20px;
        }
        #filterContainer button {
            padding: 8px 16px;
            background-color: #4285F4;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }
        #filterContainer button:hover {
            background-color: #357ae8;
        }
        /* 커뮤니티 컨테이너 스타일 */
        #communityContainer {
            margin-top: 30px;
        }
        .community-item {
            border-bottom: 1px solid #ddd;
            padding: 10px 0;
            margin-bottom: 10px;
            cursor: pointer;
        }
        .community-item strong {
            font-size: 16px;
        }

        .community-item .game-wrap {
            margin-bottom:10px;
        }

        .community-item .community-game {
            background-color: #f0f0f0;
            padding: 5px;
            border-radius: 5px;
            color: gray;
            font-size: 13px;
        }
    </style>
</head>
<body>
<!-- 상단 검색창 -->
<div class="container">
    <div class="inner-con">
        <img th:src="@{/img/levelup-logo.png}" alt="Levelup 로고" class="logo">
        <header>
            <input type="text" id="searchInput" placeholder="검색어를 입력하세요" />
            <button class="btn search-icon" onclick="searchProducts()">
                <i class="material-icons">search</i>
            </button>
        </header>
        <!-- 커뮤니티 글 목록 영역 -->
        <div id="communityContainer">
            <!-- /communities API로 받아온 커뮤니티 글 목록을 표시할 예정 -->
        </div>
    </div>
    <!-- 하단 공통 메뉴 -->
    <div th:replace="fragments :: main-nav"></div>
</div>
<button class="create-product-btn" onclick="location.href='/community/add'">글 쓰기</button>
<script>
    /*<![CDATA[*/
    const keyword = /*[[${keyword}]]*/ '';

    window.onload = function () {
        searchCommunities(keyword);
    };

    /**
     * 커뮤니티 글 목록 불러오기
     * GET /communities/search?searchKeyword=&gameName
     */
    function searchCommunities(searchKeyword) {
        fetch(`/communities/search?searchKeyword=${encodeURIComponent(searchKeyword)}&gameName=`)
            .then(response => response.json())
            .then(result => {
                if (result && result.data && result.data.communityList) {
                    displayCommunities(result.data.communityList);
                } else {
                    document.querySelector('.inner-con').innerHTML = '<p>검색 결과를 불러올 수 없습니다.</p>';
                }
            })
            .catch(err => {
                console.error('검색 에러:', err);
                document.querySelector('.inner-con').innerHTML = '<p>검색 결과를 불러오는 중 오류가 발생했습니다.</p>';
            });
    }

    function displayCommunities(communityList) {
        const container = document.querySelector('.inner-con');

        if (communityList.length === 0) {
            container.innerHTML = '<p>검색 결과가 없습니다.</p>';
            return;
        }

        communityList.forEach(community => {
            const item = document.createElement("div");
            item.className = "community-item";
            item.innerHTML = `
                <div class="game-wrap">
                    <span class="community-game">${community.game}</span>
                </div>
                <div class="community-title"><strong>${community.title}</strong></div>
                <div class="community-author">${community.author}</div>
            `;
            item.onclick = () => {
                window.location.href = `/community-detail?communityId=${community.communityId}`;
            };
            container.appendChild(item);
        });
    }


    /**
     * 검색 기능 (예시): 검색 버튼 클릭 시 검색어에 맞게 페이지 이동
     */
    function searchProducts() {
        const keyword = document.getElementById('searchInput').value.trim();
        window.location.href = `/community/search?keyword=${encodeURIComponent(keyword)}`;
    }

</script>
</body>
</html>
