<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원정보 수정</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; }
        h2 { text-align: center; margin-bottom: 20px; }
        .form-container { max-width: 400px; margin: 20px auto; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; font-size: 0.9rem; margin-bottom: 0.5rem; color: #555; }
        input[type="text"], input[type="email"], input[type="tel"], input[type="url"], input[type="password"] {
            width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;
        }
        button {
            width: 100%; padding: 10px; border: none; border-radius: 4px; background-color: #007aff; color: #fff; cursor: pointer;
        }
        button:hover { background-color: #005bb5; }
        .cancel-button { margin-top: 20px; background-color: #aaa; }
        .cancel-button:hover { background-color: #888; }

        .space-bar {
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="inner-con">
        <h2>회원정보 수정</h2>
        <form id="updateForm">
            <div class="form-group">
                <input type="email" id="email" placeholder="이메일" th:value="${email}" required>
            </div>
            <div class="form-group">
                <input type="text" id="nickName" placeholder="닉네임" th:value="${nickName}" required>
            </div>
            <div class="form-group">
                <input type="url" id="profileUrl" placeholder="프로필 URL" th:value="${profileUrl}" required>
            </div>
            <div class="form-group">
                <input type="tel" id="phoneNumber" placeholder="전화번호" th:value="${phoneNumber}" required>
            </div>
            <button type="submit">기본정보 수정</button>
        </form>

        <hr class="space-bar">

        <h2>비밀번호 수정</h2>
        <form id="passwordForm">
            <div class="form-group">
                <input type="password" id="currentPassword" placeholder="현재 비밀번호" required>
            </div>
            <div class="form-group">
                <input type="password" id="newPassword" placeholder="새 비밀번호" required>
            </div>
            <div class="form-group">
                <input type="password" id="passwordConfirm" placeholder="새 비밀번호 확인" required>
            </div>
            <button type="submit" class="submit-button">비밀번호 변경</button>
        </form>

        <button type="button" class="cancel-button" onclick="location.href='/';">취소</button>
    </div>
</div>

<script>
    document.getElementById("updateForm").addEventListener("submit", function(e) {
        e.preventDefault();
        const payload = {
            email: document.getElementById("email").value,
            nickName: document.getElementById("nickName").value,
            profileUrl: document.getElementById("profileUrl").value,
            phoneNumber: document.getElementById("phoneNumber").value
        };
        fetch('/user', { method: 'PATCH', credentials: 'include', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
            .then(response => response.json())
            .then(result => {
                alert(result.message || "회원정보 수정 성공");
                location.reload();
            })
            .catch(error => alert('수정 중 오류 발생'));
    });

    document.getElementById("passwordForm").addEventListener("submit", function(e) {
        e.preventDefault();
        const currentPassword = document.getElementById("currentPassword").value;
        const newPassword = document.getElementById("newPassword").value;
        const passwordConfirm = document.getElementById("passwordConfirm").value;

        if (newPassword !== passwordConfirm) {
            alert("새 비밀번호와 확인 비밀번호가 일치하지 않습니다.");
            return;
        }

        const payload = { currentPassword, newPassword, passwordConfirm };
        fetch('/users/changingPassword', {
            method: 'PATCH',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
            .then(response => response.json())
            .then(result => {
                if (result.status === "OK") {
                    alert("비밀번호가 성공적으로 변경되었습니다.");
                    location.reload();
                } else {
                    alert("비밀번호 변경 실패: " + result.message);
                }
            })
            .catch(error => {
                console.error('비밀번호 변경 오류:', error);
                alert("비밀번호 변경 중 오류가 발생했습니다.");
            });
    });
</script>
</body>
</html>
