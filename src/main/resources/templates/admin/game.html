<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>관리자 - 게임 목록</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; }
        header, main { padding: 10px; }
        .game-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: space-between;
        }
        .game-item {
            border: 1px solid #ccc;
            padding: 10px;
            width: 150px;
            text-align: center;
            margin-bottom: 30px;
            border-radius: 10px;
        }
        .game-item img {
            width: 100%;
            height: 100px;
            object-fit: cover;
            margin-bottom: 5px;
        }
        .add-button {
            margin-bottom: 10px;
            padding: 5px 10px;
            background-color: #007bff;
            color: #fff;
            border: none;
            cursor: pointer;
        }
        .action-buttons {
            display: flex;
            gap: 5px;
            justify-content: center;
        }

        .action-buttons button {
            margin-top: 5px;
            padding: 5px;
            font-size: 0.9rem;
            cursor: pointer;
        }
    </style>
    <!-- jQuery CDN -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
</head>
<body>
<div class="container">
    <div class="inner-con">
        <header>
            <h2>게임 관리</h2>
        </header>
        <main>
            <button class="add-button" onclick="goAddGamePage()">게임 추가</button>
            <!-- 게임 목록이 출력될 영역 -->
            <div class="game-list" id="gameList"></div>
        </main>
    </div>
    <!-- 하단 공통 메뉴 -->
    <div th:replace="fragments :: main-nav"></div>
</div>

<script>
    $(document).ready(function(){
        fetchGames();
    });

    /* API 호출 - 게임 목록 불러오기 */
    function fetchGames(){
        $.ajax({
            url: '/games',
            type: 'GET',
            dataType: 'json',
            success: function(response) {
                // 응답 데이터 구조가 { data: { gameList: [...] } }라고 가정
                if(response.data && response.data.gameList) {
                    renderGames(response.data.gameList);
                } else {
                    console.error('게임 목록 데이터 형식 확인 필요', response);
                }
            },
            error: function(error) {
                console.error('게임 목록 불러오기 실패:', error);
            }
        });
    }

    /* 화면 렌더링 - jQuery 템플릿 활용 */
    function renderGames(games){
        const $gameList = $('#gameList');
        $gameList.empty();

        $.each(games, function(index, game) {
            // 게임 아이템 HTML 생성 (수정/삭제 버튼 포함)
            const gameHTML = `
      <div class="game-item">
        <img src="${game.imgUrl}" alt="${game.name}">
        <h3>${game.name}</h3>
        <p>${game.genre}</p>
        <div class="action-buttons">
          <button class="edit-btn">수정</button>
          <button class="delete-btn">삭제</button>
        </div>
      </div>
    `;

            const $gameItem = $(gameHTML);

            // 수정 버튼 이벤트 바인딩
            $gameItem.find('.edit-btn').click(function(){
                updateGame(game);
            });

            // 삭제 버튼 이벤트 바인딩
            $gameItem.find('.delete-btn').click(function(){
                if(confirm('정말 삭제하시겠습니까?')) {
                    deleteGame(game.id);
                }
            });

            $gameList.append($gameItem);
        });
    }

    /* API 호출 - 게임 삭제 */
    function deleteGame(gameId){
        $.ajax({
            url: '/admin/games/' + gameId,
            type: 'DELETE',
            contentType: 'application/json',
            dataType: 'json',
            success: function(response) {
                if(response.status === 200) {
                    alert('삭제 성공');
                    fetchGames();
                } else {
                    alert('삭제 실패: ' + response.message);
                }
            },
            error: function(error) {
                console.error('게임 삭제 실패:', error);
            }
        });
    }

    /* API 호출 - 게임 수정 (prompt 이용) */
    function updateGame(game){
        const newName = prompt('새 게임 이름을 입력하세요:', game.name);
        const newImgUrl = prompt('새 이미지 URL을 입력하세요:', game.imgUrl);
        const newGenre = prompt('새 장르를 입력하세요:', game.genre);

        if(newName && newImgUrl && newGenre){
            $.ajax({
                url: '/admin/games/' + game.id,
                type: 'PATCH',
                contentType: 'application/json',
                dataType: 'json',
                data: JSON.stringify({
                    name: newName,
                    imgUrl: newImgUrl,
                    genre: newGenre
                }),
                success: function(response) {
                    if(response.status === 200) {
                        alert('수정 성공');
                        fetchGames();
                    } else {
                        alert('수정 실패: ' + response.message);
                    }
                },
                error: function(error) {
                    console.error('게임 수정 실패:', error);
                }
            });
        }
    }

    /* 게임 추가 페이지로 이동 */
    function goAddGamePage(){
        window.location.href = '/admin/games/add';
    }
</script>
</body>
</html>
