<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>관리자 - 게임 수정</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; }
        header, main { padding: 10px; }
        .form-container {
            max-width: 400px;
            margin: 20px auto;
            border: 1px solid #ccc;
            padding: 20px;
            border-radius: 8px;
            background-color: #fff;
        }
        .form-group { margin-bottom: 15px; }
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
        }
        input[type="text"],
        input[type="file"] {
            width: 100%;
            padding: 10px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .submit-button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            border: none;
            color: #fff;
            font-size: 1rem;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .submit-button:hover {
            background-color: #005bb5;
        }
        .cancel-button {
            width: 100%;
            padding: 10px;
            background-color: #ccc;
            border: none;
            color: #333;
            font-size: 1rem;
            border-radius: 4px;
            cursor: pointer;
        }
        .cancel-button:hover {
            background-color: #aaa;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="inner-con">
        <header>
            <h2>게임 수정</h2>
        </header>
        <main>
            <div class="form-container">
                <form id="updateGameForm">
                    <!-- 수정할 게임 ID (서버에서 모델로 전달받은 값) -->
                    <input type="hidden" id="gameId" name="gameId" value="[[${gameId}]]">
                    <div class="form-group">
                        <label for="name">게임 이름</label>
                        <input type="text" id="name" name="name" placeholder="게임 이름을 입력하세요" required>
                    </div>
                    <div class="form-group">
                        <label for="image">이미지 파일</label>
                        <input type="file" id="image" name="image" accept="image/*">
                    </div>
                    <div class="form-group">
                        <label for="genre">장르</label>
                        <input type="text" id="genre" name="genre" placeholder="게임 장르를 입력하세요" required>
                    </div>
                    <button type="submit" class="submit-button">게임 수정</button>
                    <button type="button" class="cancel-button" onclick="location.href='/admin/dashboard/game'">취소</button>
                </form>
            </div>
        </main>
    </div>
    <!-- 하단 공통 메뉴 -->
    <div th:replace="fragments :: main-nav"></div>
</div>

<script>
    // 페이지 로딩 시 현재 게임 정보를 가져와 폼에 채워줍니다.
    document.addEventListener('DOMContentLoaded', function() {
        const gameId = document.getElementById('gameId').value;
        fetch('/admin/games/' + gameId)
            .then(response => response.json())
            .then(data => {
                if (data && data.data) {
                    const game = data.data;
                    document.getElementById('name').value = game.name;
                    document.getElementById('genre').value = game.genre;
                    // 이미지 파일은 보안 상 pre-populate할 수 없으므로, 필요하다면 썸네일 등을 별도로 표시할 수 있습니다.
                } else {
                    console.error('게임 정보를 불러오지 못했습니다.', data);
                }
            })
            .catch(error => {
                console.error('게임 정보 요청 중 오류 발생:', error);
            });
    });

    document.getElementById('updateGameForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const gameId = document.getElementById('gameId').value;
        const name = document.getElementById('name').value;
        const genre = document.getElementById('genre').value;
        const fileInput = document.getElementById('image');
        const imageFile = fileInput.files[0];

        const formData = new FormData();
        // 새 이미지가 선택된 경우에만 파일 추가 (선택하지 않으면 기존 이미지 유지)
        if(imageFile) {
            formData.append("image", imageFile);
        }
        formData.append("dto", new Blob([JSON.stringify({ name, genre })], { type: "application/json" }));

        fetch('/admin/games/' + gameId, {
            method: 'PATCH',
            body: formData
        })
            .then(response => response.json())
            .then(data => {
                if(data.status === "OK") {
                    alert("게임 수정 성공");
                    location.href = '/admin/dashboard/game';
                } else {
                    alert("게임 수정 실패: " + data.message);
                }
            })
            .catch(error => {
                console.error("게임 수정 오류:", error);
                alert("게임 수정 중 오류가 발생했습니다.");
            });
    });
</script>
</body>
</html>
