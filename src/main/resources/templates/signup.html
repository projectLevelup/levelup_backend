<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>회원가입</title>
  <link rel="stylesheet" th:href="@{/css/common.css}">
  <style>

    h2 {
      text-align: center;
      font-size: 1.8rem;
      margin-bottom: 1.5rem;
      color: #333;
    }
    form {
      display: flex;
      flex-direction: column;
    }
    .form-group {
      margin-bottom: 1rem;
    }
    label {
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
      color: #555;
    }
    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="tel"] {
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
      width: 100%;
      box-sizing: border-box;
      transition: border-color 0.3s ease;
    }
    input:focus {
      border-color: #007aff;
      outline: none;
    }
    button {
      padding: 12px;
      border: none;
      border-radius: 8px;
      background-color: #007aff;
      color: #fff;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s ease;
      width: 100%;
    }
    button:hover {
      background-color: #005bb5;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="inner-con">
    <div class="py-4 text-center">
      <h2>회원가입</h2>
    </div>
    <form id="signupForm">
      <div class="form-group">
        <input type="text" id="email" placeholder="이메일 입력" name="email" required>
      </div>
      <div class="form-group">
        <input type="text" id="nickName" placeholder="닉네임 입력" name="nickName" required>
      </div>
      <div class="form-group">
        <input type="password" id="password" placeholder="비밀번호 입력" name="password" required>
      </div>
      <div class="form-group">
        <input type="text" id="phoneNumber" placeholder="전화번호 입력" name="phoneNumber" required>
      </div>
      <div class="form-group">
        <button type="submit">회원가입</button>
      </div>
    </form>
  </div>
</div>
<script>
  // 전화번호 입력 시 하이픈 자동 추가
  document.getElementById("phoneNumber").oninput = function() {
    let number = /^-?\d+$/;
    let phone = document.getElementById("phoneNumber");
    if (number.test(phone.value.toString())) {
      if (phone.value.toString().length == 11) {
        phone.value = phone.value.substring(0, 3) + "-" + phone.value.substring(3, 7) + "-" + phone.value.substring(7, 11);
      }
    }
  };

  // 폼 제출 이벤트를 인터셉트하여 AJAX 요청으로 회원가입 처리
  document.getElementById("signupForm").addEventListener("submit", function(e) {
    e.preventDefault();
    const email = document.getElementById("email").value;
    const nickName = document.getElementById("nickName").value;
    const password = document.getElementById("password").value;
    const phoneNumber = document.getElementById("phoneNumber").value;

    const payload = { email, nickName, password, phoneNumber };

    fetch("/signup", {
      method: "POST",
      credentials: "include",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    })
            .then(response => response.json())
            .then(result => {
              if (result.status === "CREATED") {
                alert("회원가입이 성공적으로 완료되었습니다.");
                window.location.href = "/signin";
              } else {
                alert("회원가입 실패: " + (result.errorMessage || result.detail || result.message));
              }
            })
            .catch(error => {
              console.error("회원가입 중 오류:", error);
              alert("회원가입 중 오류가 발생했습니다.");
            });
  });
</script>
</body>
</html>
