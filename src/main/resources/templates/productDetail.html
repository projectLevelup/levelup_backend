<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <title>상품 상세</title>
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; }
        .product-detail { display: flex; gap: 20px; margin-bottom: 30px; flex-direction: column; }
        .product-left {
            height: 200px;
            overflow: hidden;
            display: flex;
            border-radius: 10px;
        }
        .productName {
            text-align: left;
        }

        .product-left img {
            width: 100%;
            object-fit: cover;
        }
        .product-right {
            border-bottom: 1px solid #f0f0f0;
        }
        .product-detail .button-box {
            display: flex;
            gap: 10px;
        }
        .review-box {
            border-top: 1px solid #f0f0f0;
            padding-top: 20px;
        }
        .review-item {
            border-bottom: 1px solid #ccc;
            padding: 8px 0;
        }
        .review-item:last-child {
            border-bottom: none;
        }
        .review-nickname { font-weight: bold; margin-right: 5px; }
        .star-score { color: #f1c40f; }
        .review-contents { margin-top: 5px; }
        /* 신청하기 버튼 스타일 */
        #chatButton,
        #applyButton {
            display: block;
            margin: 20px 0;
            padding: 10px 20px;
            font-size: 1em;
            background-color: #4285F4;
            color: #fff;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="top-nav">
        <h3>상품 상세 페이지</h3>
    </div>
    <div class="inner-con">
        <!-- 상품 상세 영역 -->
        <div class="product-detail">
            <div class="product-left">
                <img id="productImg" src="/img/default-img.png" alt="상품 이미지">
            </div>
            <div class="product-right">
                <h2 id="productName"></h2>
                <div id="productPrice"></div>
                <div class="button-box">
                    <button id="applyButton" onclick="applyProduct()">신청하기</button>
                    <!-- 채팅하기 버튼 -->
                    <button id="chatButton" onclick="openChat()">채팅하기</button>
                </div>
            </div>
            <div class="contents-box">
                <div id="productContents"></div>
            </div>
        </div>

        <!-- 리뷰 영역 -->
        <div class="review-box">
            <h3>리뷰</h3>
            <div id="reviewList">
                <!-- 리뷰 목록이 동적으로 삽입됩니다. -->
            </div>
        </div>
    </div>
    <!-- 하단 공통 메뉴 -->
    <div th:replace="fragments :: main-nav"></div>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    const productId = /*[[${productId}]]*/ 0;
    let sellerId = null; // 상품의 판매자 ID 저장

    window.onload = function() {
        if (!productId) {
            alert("상품 ID가 존재하지 않습니다.");
            return;
        }
        loadProductDetail(productId);
        loadReviews(productId);
    };

    function loadProductDetail(id) {
        fetch(`/products/${id}`)
            .then(response => response.json())
            .then(result => {
                if (result && result.data) {
                    displayProductDetail(result.data);
                } else {
                    console.error("상품 상세 불러오기 실패");
                }
            })
            .catch(error => console.error("상품 상세 에러:", error));
    }

    function displayProductDetail(product) {
        document.getElementById("productName").textContent = product.productName || "상품명 없음";
        document.getElementById("productPrice").textContent = `${product.price}원`;
        document.getElementById("productContents").textContent = product.contents || "";
        sellerId = product.userId;
        document.getElementById("productImg").src = product.imgUrl ? product.imgUrl : "/img/default-img.png";
    }

    async function createChatroom() {
        try {
            if (!sellerId) {
                alert("판매자 정보가 없습니다.");
                return null;
            }
            const response = await fetch(`/chats?targetUserId=${sellerId}`, {
                method: "POST",
                credentials: "include",
                headers: { "Content-Type": "application/json" }
            });
            const result = await response.json();
            if (result && result.data && result.data.chatroomId) {
                return result.data.chatroomId;
            } else {
                alert("채팅방 생성에 실패했습니다.");
                return null;
            }
        } catch (error) {
            console.error("채팅방 생성 중 에러:", error);
            alert("채팅방 생성 중 오류가 발생했습니다.");
            return null;
        }
    }

    async function openChat() {
        try {
            const newChatroomId = await createChatroom();
            if (newChatroomId) {
                window.location.href = "/chatroom?chatroomId=" + newChatroomId;
            } else {
                alert("채팅방 생성에 실패했습니다.");
            }
        } catch (error) {
            console.error("채팅방 생성/이동 중 에러:", error);
            alert("채팅방 생성/이동 중 오류가 발생했습니다.");
        }
    }

    // 주문 생성: "신청하기" 버튼 클릭 시 호출
    function applyProduct() {
        if (!productId) {
            alert("상품 ID가 없습니다.");
            return;
        }
        const requestData = {
            productId: Number(productId)
        };
        fetch('/orders', {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(requestData)
        })
            .then(response => response.json())
            .then(result => {
                if (result.errorCode) {
                    alert(result.errorMessage || result.detail || "주문 생성 실패");
                } else if (result && result.data) {
                    alert("주문이 생성되었습니다: 주문 번호 " + result.data.orderId);
                    // 필요에 따라 주문 상세 페이지로 리다이렉트 가능
                } else {
                    alert("주문 생성 실패: " + (result.message || "알 수 없는 오류"));
                }
            })
            .catch(error => {
                console.error("주문 생성 중 에러:", error);
                alert("주문 생성 중 오류가 발생했습니다.");
            });
    }

    // 리뷰 목록 로드 함수
    function loadReviews(productId) {
        fetch(`/products/${productId}/reviews`, { credentials: 'include' })
            .then(response => response.json())
            .then(result => {
                if (result && result.data && result.data.content) {
                    displayReviews(result.data.content);
                } else {
                    document.getElementById('reviewList').innerHTML = '<p>리뷰가 없습니다.</p>';
                }
            })
            .catch(error => {
                console.error("리뷰 조회 오류:", error);
                document.getElementById('reviewList').innerHTML = '<p>리뷰를 불러올 수 없습니다.</p>';
            });
    }

    function displayReviews(reviews) {
        const container = document.getElementById('reviewList');
        container.innerHTML = "";
        if (reviews.length === 0) {
            container.innerHTML = '<p>리뷰가 없습니다.</p>';
            return;
        }
        reviews.forEach(review => {
            const reviewDiv = document.createElement('div');
            reviewDiv.className = 'review-item';
            let stars = "";
            for (let i = 1; i <= review.starScore; i++) {
                stars += "★";
            }
            for (let i = review.starScore + 1; i <= 5; i++) {
                stars += "☆";
            }
            reviewDiv.innerHTML = `
        <div class="review-nickname">${review.nickname}</div>
        <div class="star-score">${stars}</div>
        <div class="review-contents">${review.contents}</div>
      `;
            container.appendChild(reviewDiv);
        });
    }
    /*]]>*/
</script>
</body>
</html>
