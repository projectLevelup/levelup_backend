<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <title>메인 페이지</title>
    <style>
        /* 간단한 스타일 예시 */
        body {
            margin: 0;
            font-family: sans-serif;
        }

        .logo {
            width: 120px;
        }

        header {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        #categoryContainer {
            margin-top: 15px;
            margin-bottom: 30px;
        }

        .category-item {
            display: inline-block;
            margin-right: 25px;
            vertical-align: top;
            text-align: center;
            border-radius: 10px;
        }

        .category-item img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            display: block;
        }


        .product-item img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            display: block;
        }

        .product-item {
            display: flex;
            padding-bottom: 20px;
            padding-top: 20px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
        }

        .product-left {
            margin-right: 30px;
            border-radius: 10px;
        }

        .product-right {
            width: 100%;
        }

        .product-right strong {
            font-size: 18px;
        }

        .create-product-btn {
            position: fixed;
            bottom: 75px; /* 네비게이션 바(50px) 위에 10px 여유 */
            right: calc((100% - 400px) / 2 + 25px); /* 중앙 컨테이너의 오른쪽 끝에서 10px 안쪽 */
            padding: 10px 20px;
            background-color: #4285F4;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            z-index: 1100; /* 네비게이션보다 위에 표시 */
        }

        /* 필터 버튼 영역 */
        #filterContainer {
            margin-bottom: 20px;
        }
        #filterContainer button {
            padding: 8px 16px;
            background-color: #4285F4;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }
        #filterContainer button:hover {
            background-color: #357ae8;
        }

        .product-btn {
            padding: 5px 16px;
        }

        .btn-wrap {
            display: flex;
            margin-top: 15px;
            gap: 8px;
            flex-direction: row;
            justify-content: flex-end;
        }

    </style>
</head>
<body>
<!-- 상단 검색창 -->


<div class="container">
    <div class="inner-con">
        <h2>내 상품 목록</h2>
        <!-- 상품 목록 영역 -->
        <div id="productContainer">
            <!-- /v1/products API로 받아온 상품 목록을 표시할 예정 -->
        </div>




    </div>


    <!-- 하단 공통 메뉴 -->
    <div th:replace="fragments :: main-nav"></div>
</div>

<script th:inline="javascript">
    // 검색 결과 페이지 로드시 검색어에 해당하는 상품을 불러옴
    window.onload = function() {
        fetch('/products/user', { credentials: 'include' })
            .then(response => response.json())
            .then(result => {
                if (result && result.data && result.data.content) {
                    displayProducts(result.data.content);
                } else {
                    document.getElementById('productContainer').innerHTML = '<p>등록한 상품이 없습니다.</p>';
                }
            })
            .catch(error => {
                console.error('상품 조회 오류:', error);
                document.getElementById('productContainer').innerHTML = '<p>상품을 불러오는 중 오류가 발생했습니다.</p>';
            });
    };

    // 검색 결과를 화면에 렌더링하는 함수
    function displayProducts(productList) {
        const container = document.getElementById('productContainer');
        container.innerHTML = ''; // 기존 내용 초기화
        productList.forEach(product => {
            const item = document.createElement('div');
            item.className = 'product-item';
            item.innerHTML = `
                    <div class="product-left">
                        <img src="${product.imgUrl || '/img/default-img.png'}" alt="${product.productName}" />
                    </div>
                    <div class="product-right">
                        <div><strong>${product.productName}</strong></div>
                        <div class="price">${product.price}원</div>
                        <div class="btn-wrap">
                            <button class="product-btn" onclick="goToUpdatePage(event, ${product.productId})">수정</button>
                            <button class="product-btn" onclick="deleteProduct(event, ${product.productId})">삭제</button>
                        </div>
                    </div>
                `;
            container.appendChild(item);
        });
    }
    function goToUpdatePage(event, productId) {
        event.stopPropagation(); // 명시적으로 이벤트 버블링을 방지
        window.location.href = `/profile/my-products/update?productId=${productId}`;
    }

    function deleteProduct(event, productId) {
        event.stopPropagation();
        if (!confirm("정말 삭제하시겠습니까?")) return;

        fetch(`/products/${productId}`, { method: 'DELETE', credentials: 'include' })
            .then(response => response.json())
            .then(result => {
                if (result.status === 'OK') {
                    alert("상품이 삭제되었습니다.");
                    location.reload();
                } else {
                    alert("상품 삭제 실패: " + result.message);
                }
            })
            .catch(error => {
                console.error('상품 삭제 오류:', error);
                alert("상품 삭제 중 오류가 발생했습니다.");
            });
    }


</script>
</body>
</html>
