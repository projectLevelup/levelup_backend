<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>프로필</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            background-color: #f9f9f9;
        }
        .profile-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .profile-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .profile-img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
        }
        .nickname {
            font-size: 18px;
            font-weight: bold;
        }
        .settings-icon {
            cursor: pointer;
            font-size: 24px;
            color: #666;
        }
        .role-section {
            display: flex;
            justify-content: center;
            margin: 20px 0;
            font-size: 14px;
            color: #999;
        }
        /* 탭 헤더 스타일 */
        .tab-header {
            display: flex;
            list-style: none;
            padding: 0;
            border-bottom: 1px solid #eee;
        }
        .tab-header .tab {
            flex: 1;
            text-align: center;
            padding: 10px 0;
            cursor: pointer;
            font-weight: bold;
            color: #666;
        }
        .tab-header .tab.active {
            color: #4285F4;
            border-bottom: 2px solid #4285F4;
        }
        /* 탭 컨텐츠 스타일 */
        .tab-content ul {
            list-style: none;
            padding: 0;
        }
        .tab-content li {
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
        }
        .tab-content li:hover {
            font-weight: 600;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="inner-con">
        <!-- 상단 프로필 영역 -->
        <div class="profile-top">
            <div class="profile-info">
                <img id="profileImg" src="/img/default-img.png" alt="프로필 이미지" class="profile-img" />
                <div>
                    <div id="nickname" class="nickname"></div>
                </div>
            </div>
            <!-- 설정 아이콘 (예: 톱니바퀴) -->
            <i class="material-icons settings-icon" onclick="location.href='/profile/update'">settings</i>
        </div>

        <!-- 역할(사부/제자 등) 표시할 수 있는 섹션 (옵션) -->
        <div class="role-section" id="roleLabel">
            <!-- API 응답에 따라 "제자", "사부" 등 표시 (예시) -->
        </div>

        <hr/>

        <!-- 메뉴 탭 영역 -->
        <div class="profile-menu">
            <ul class="tab-header">
                <li class="tab active" onclick="showTab('teacher')">스승</li>
                <li class="tab" onclick="showTab('student')">제자</li>
            </ul>
            <div id="teacherTab" class="tab-content">
                <ul>
                    <li onclick="goMyLectures()">내 강의목록</li>
                    <li onclick="location.href='/profile/order/tutor'">주문 목록</li>
                    <li onclick="location.href='/profile/bills/tutor'">내 판매내역</li>
                </ul>
            </div>
            <div id="studentTab" class="tab-content" style="display: none;">
                <ul>
                    <li onclick="location.href='/profile/bills/student'">내 결제내역</li>
                    <li onclick="location.href='/profile/order/student'">내 주문내역</li>
                </ul>
            </div>
        </div>
    </div>
    <!-- 하단 공통 메뉴 -->
    <div th:replace="fragments :: main-nav"></div>
</div>

<script>
    window.onload = function() {
        loadUserProfile();
    };

    /**
     * 현재 로그인한 사용자 정보 불러오기 (GET /v1/users)
     */
    function loadUserProfile() {
        fetch('/users', {
            method: 'GET',
            credentials: 'include'
        })
            .then(response => response.json())
            .then(result => {
                if (result && result.data) {
                    displayUserProfile(result.data);
                } else {
                    console.error("유저 조회 실패");
                }
            })
            .catch(error => {
                console.error("유저 조회 에러:", error);
            });
    }

    /**
     * 프로필 화면 표시
     */
    function displayUserProfile(user) {
        document.getElementById("nickname").textContent = user.nickName || "닉네임 없음";
        // 역할에 따라 roleLabel도 설정 (예시)
        // document.getElementById("roleLabel").textContent = "사부";
    }

    /**
     * 설정(톱니바퀴) 아이콘 클릭 시
     */
    function goSettings() {
        alert("설정 페이지 이동 (예시)");
    }

    /**
     * 메뉴 항목 클릭 시 예시 함수
     */
    function goMyLectures() {
        alert("내 강의목록 페이지 이동 (예시)");
    }

    /**
     * 탭 전환 함수
     */
    function showTab(tabName) {
        // 탭 헤더 active 클래스 토글
        const tabs = document.querySelectorAll('.tab-header .tab');
        tabs.forEach(tab => tab.classList.remove('active'));

        // 모든 탭 컨텐츠 숨기기
        document.getElementById('teacherTab').style.display = 'none';
        document.getElementById('studentTab').style.display = 'none';

        // 선택한 탭 컨텐츠 보이기 및 해당 탭 active 설정
        if (tabName === 'teacher') {
            document.getElementById('teacherTab').style.display = 'block';
            tabs[0].classList.add('active');
        } else if (tabName === 'student') {
            document.getElementById('studentTab').style.display = 'block';
            tabs[1].classList.add('active');
        }
    }
</script>
</body>
</html>
