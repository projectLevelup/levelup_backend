<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <title>상품 생성</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; }
        label { display: block; margin-top: 10px; }
        input[type="text"], input[type="number"] {
            padding: 5px;
            margin-top: 5px;
        }

        #productForm p {
            font-weight: 600;
        }

        #productForm input[type="text"],
        #productForm input[type="number"],
        #productForm select,
        #productForm textarea {
            min-height: 36px;
            width: 100%;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        /* 게임 목록을 이미지 박스로 가로 정렬 */
        .game-box-container {
            display: flex;
            overflow-x: auto;
            gap: 15px;
            margin-top: 10px;
            padding-bottom: 10px;
        }
        .game-box {
            flex: 0 0 auto;
            width: 70px;
            height: 70px;
            border: 2px solid transparent;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: border-color 0.3s;
        }
        .game-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .game-box.selected {
            border-color: #4285F4;
        }
        select, .btn, .cancel-btn {
            padding: 5px;
            margin-top: 5px;
        }
        .btn {
            width: 100%;
            margin-top: 20px;
            padding: 8px 16px;
            background-color: #4285F4;
            color: #fff;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }
        .btn:hover {
            background-color: #357ae8;
        }
        .cancel-btn {
            background-color: #aaa;
        }

        #contents {
            height: 200px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="inner-con">
        <h2>상품 생성</h2>
        <form id="productForm">
            <label>
                <p>게임 선택</p>
                <div id="gameContainer" class="game-box-container">
                    <!-- loadGames() 함수가 API 호출 후 게임 박스를 동적으로 추가 -->
                </div>
            </label>
            <label>
                <p>제목</p>
                <input type="text" id="productName" required maxlength="255" />
            </label>
            <label>
                <p>썸네일</p>
                <input type="file" id="imageFile" class="file-input" accept="image/*" required />
            </label>
            <label>
                <p>가격</p>
                <input type="text" id="price" required />
            </label>
            <label>
                <p>자세한 설명</p>
                <textarea type="text" id="contents" required maxlength="1000"></textarea>
            </label>
            <label>
                <p>인원 제한</p>
                <input type="number" id="amount" required />
            </label>
            <label>
                <p>상태</p>
                <select id="status" required>
                    <option value="ACTIVE">ACTIVE</option>
                    <option value="INACTIVE">INACTIVE</option>
                </select>
            </label>


            <button type="button" class="btn" onclick="createProduct()">상품 등록</button>
            <button type="button" class="btn cancel-btn" onclick="cancel()">취소</button>
        </form>
    </div>

</div>

<script>
    // 전역 변수: 선택된 게임 ID
    let selectedGameId = null;

    // 페이지 로드 시 게임 목록을 불러옵니다.
    window.onload = function() {
        loadGames();
    };

    /**
     * 게임 목록 불러오기 (GET /v1/games)
     * API 응답 예시: { status, message, data: { gameListResponseDto: [ { id, name, imgUrl, ... }, ... ] } }
     */
    function loadGames() {
        fetch('/games')
            .then(response => response.json())
            .then(result => {
                // 응답 데이터가 data.gameList 배열에 있음.
                if (result && result.data && result.data.gameList) {
                    const gameList = result.data.gameList;
                    displayGameBoxes(gameList);
                } else {
                    console.error('게임 목록 데이터 형식 확인 필요', result);
                }
            })
            .catch(error => {
                console.error('게임 목록 불러오기 에러:', error);
            });
    }

    /**
     * 게임 목록을 이미지 박스로 가로로 표시
     */
    function displayGameBoxes(gameList) {
        const container = document.getElementById('gameContainer');
        container.innerHTML = ''; // 초기화

        gameList.forEach(game => {
            const box = document.createElement('div');
            box.className = 'game-box';
            box.innerHTML = `<img src="${game.imgUrl}" alt="${game.name}" title="${game.name}">`;

            // 클릭 시 선택 처리
            box.onclick = function() {
                // 모든 박스에서 'selected' 클래스 제거
                document.querySelectorAll('.game-box').forEach(b => b.classList.remove('selected'));
                // 클릭한 박스에 'selected' 클래스 추가
                box.classList.add('selected');
                // 선택된 게임 ID 저장 (API 응답에 id 필드가 있다고 가정)
                selectedGameId = game.gameId;
                console.log("선택된 게임 ID:", selectedGameId);
            };

            container.appendChild(box);
        });
    }

    /**
     * 상품 생성 요청 (POST /v1/products)
     */
    function createProduct() {
        if (!selectedGameId) {
            alert("게임을 선택해주세요.");
            return;
        }
        const productName = document.getElementById('productName').value;
        const contents = document.getElementById('contents').value;
        const price = document.getElementById('price').value;
        const amount = document.getElementById('amount').value;
        const status = document.getElementById('status').value;
        const imageFile = document.getElementById('imageFile').files[0];

        if (!productName || !contents || !price || !amount || !status) {
            alert("필수 항목을 모두 입력해주세요.");
            return;
        }
        if (!imageFile) {
            alert("이미지 파일을 선택해주세요.");
            return;
        }

        // FormData 생성
        const formData = new FormData();
        // JSON 형태의 DTO를 Blob으로 생성하여 formData에 추가 (키: dto)
        const dto = {
            gameId: Number(selectedGameId),
            productName: productName,
            contents: contents,
            price: Number(price),
            amount: Number(amount),
            status: status,
            imgUrl: "" // 이미지 파일이 따로 전송되므로 비워둡니다.
        };
        formData.append("dto", new Blob([JSON.stringify(dto)], { type: "application/json" }));
        // 이미지 파일 추가 (키: image)
        formData.append("image", imageFile);

        fetch('/products', {
            method: 'POST',
            credentials: 'include',
            body: formData
        })
            .then(response => response.json())
            .then(result => {
                if (result && result.data) {
                    alert("상품이 생성되었습니다: " + result.data.productId);
                    window.location.href = "/";
                } else {
                    alert("상품 생성 실패: " + (result.message || "알 수 없는 오류"));
                }
            })
            .catch(error => {
                console.error('상품 생성 중 에러:', error);
                alert("상품 생성 중 오류가 발생했습니다.");
            });
    }

    /**
     * 취소 버튼 클릭 시
     */
    function cancel() {
        window.location.href = "/";
    }
</script>
</body>
</html>
