<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <title>메인 페이지</title>
    <style>
        /* 간단한 스타일 예시 */
        body {
            margin: 0;
            font-family: sans-serif;
        }

        .logo {
            width: 120px;
        }

        header {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        #categoryContainer {
            margin-top: 20px;
            margin-bottom: 30px;
        }

        .category-item {
            display: inline-block;
            margin-right: 25px;
            vertical-align: top;
            text-align: center;
            border-radius: 10px;
        }

        .category-item img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            display: block;
        }


        .product-item img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            display: block;
        }

        .product-item {
            display: flex;
            padding-bottom: 20px;
            padding-top: 20px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
        }

        .product-left {
            margin-right: 30px;
            border-radius: 10px;
        }

        .product-right strong {
            font-size: 18px;
        }

        .create-product-btn {
            position: fixed;
            bottom: 75px; /* 네비게이션 바(50px) 위에 10px 여유 */
            right: calc((100% - 400px) / 2 + 25px); /* 중앙 컨테이너의 오른쪽 끝에서 10px 안쪽 */
            padding: 10px 20px;
            background-color: #4285F4;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            z-index: 1100; /* 네비게이션보다 위에 표시 */
        }

        /* 필터 버튼 영역 */
        #filterContainer {
            margin-bottom: 20px;
        }
        #filterContainer button {
            padding: 8px 16px;
            background-color: rgb(247, 249, 250); /* 비활성 상태: 연한 회색 */
            color: #666;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            margin-right: 5px;
        }
        #filterContainer button.active {
            background-color: #4285F4; /* 활성 상태: 파란색 */
            color: #fff;
        }

        /* 로딩 오버레이 기본 스타일 */
        #loadingOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            display: none; /* 기본은 숨김 */
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        /* 스피너 스타일 (예시) */
        .spinner {
            border: 8px solid #f3f3f3; /* 연한 회색 */
            border-top: 8px solid #4285F4; /* 파란색 */
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
        }

        /* 스피너 애니메이션 */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }


    </style>
</head>
<body>
<div id="loadingOverlay">
    <div class="spinner"></div>
</div>
<!-- 상단 검색창 -->


<div class="container">
    <div class="inner-con">
        <img th:src="@{/img/levelup-logo.png}" alt="Levelup 로고" class="logo">
        <header>
            <input type="text" id="searchInput" placeholder="검색어를 입력하세요" />
            <button class="btn search-icon" onclick="searchProducts()">
                <i class="material-icons">search</i>
            </button>

        </header>
        <!-- 게임 카테고리 영역 -->
        <div id="categoryContainer">
            <!-- /games API로 받아온 게임 목록을 표시할 예정 -->
        </div>

        <!-- 필터 버튼 영역 -->
        <div id="filterContainer">
            <button id="allButton" class="active" onclick="setActiveFilter('all')">전체</button>
            <button id="popularButton" onclick="setActiveFilter('popular')">인기</button>
        </div>

        <!-- 상품 목록 영역 -->
        <div id="productContainer">
            <!-- /v1/products API로 받아온 상품 목록을 표시할 예정 -->
        </div>




    </div>


    <!-- 하단 공통 메뉴 -->
    <div th:replace="fragments :: main-nav"></div>
</div>

<button class="create-product-btn" onclick="location.href='/products/add'">강의개설</button>
<script>
    function getCookie(name) {
        const cookies = document.cookie.split('; ');
        for (let cookie of cookies) {
            const [key, value] = cookie.split('=');
            if (key === name) {
                return decodeURIComponent(value);
            }
        }
        return null; // 쿠키가 없을 경우 null 반환
    }

    // 자동로그인이 켜져있는지 확인.
    let autoLogin = getCookie("autoLogin");
    if (autoLogin === null) {
        let date = new Date();
        date.setTime(date.getTime());
        document.cookie = "refreshToken=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
    }
    // 1. 페이지 로드시 게임 목록과 상품 목록을 불러온다.
    window.onload = function() {
        document.getElementById("loadingOverlay").style.display = "flex";
        loadGames();
        loadProducts();
        setTimeout(function() {
            document.getElementById("loadingOverlay").style.display = "none";

        }, 500);
    };

    /**
     * 2. 게임 카테고리 목록 불러오기
     * GET /games => { status, message, data: { gameList: [ {name, imgUrl, genre}, ... ] } }
     */
    function loadGames() {
        fetch('/games')
            .then(response => response.json())
            .then(result => {
                // 응답 데이터가 data.gameList 배열에 있음.
                if (result && result.data && result.data.gameList) {
                    const gameList = result.data.gameList;
                    displayGames(gameList);
                } else {
                    console.error('게임 목록 데이터 형식 확인 필요', result);
                }
            })
            .catch(error => {
                console.error('게임 목록 불러오기 에러:', error);
            });
    }

    /**
     * 3. 상품 목록 불러오기 (전체 상품)
     * GET /products => { status, message, data: [ { userId, gameId, productName, ... }, ... ] }
     */
    function loadProducts() {
        fetch('/products')
            .then(response => response.json())
            .then(result => {
                // 이제 응답 데이터에서 상품 목록은 result.data.content에 존재합니다.
                if (result && result.data && result.data.content) {
                    displayProducts(result.data.content);
                } else {
                    console.error('상품 목록 데이터 형식 확인 필요', result);
                }
            })
            .catch(error => {
                console.error('상품 목록 불러오기 에러:', error);
            });
    }

    /**
     * 인기 상품 Top 10 조회
     * GET /aggregations/popular => { status, message, data: [ { id, productId, productName, ... }, ... ] }
     */
    function loadPopularProducts() {
        fetch('/products/aggregations/popular')
            .then(response => response.json())
            .then(result => {
                if (result && result.data && result.data.content) {
                    displayProducts(result.data.content);
                } else {
                    console.error('인기 상품 목록 불러오기 실패', result);
                }
            })
            .catch(error => {
                console.error('인기 상품 목록 불러오기 에러:', error);
            });
    }

    /**
     * 4. 검색 기능 (단순 예시)
     * 실제로는 서버에서 검색 API를 구현하거나, 프론트엔드에서 필터링할 수 있음
     */
    function searchProducts() {
        const keyword = document.getElementById('searchInput').value.trim();
        if (!keyword) {
            alert("검색어를 입력하세요.");
            return;
        }
        // 검색 결과 페이지로 이동 (query parameter로 검색어 전달)
        window.location.href = `/search?productName=${encodeURIComponent(keyword)}`;
    }

    /**
     * 5. 게임 목록 UI 표시
     */
    function displayGames(gameList) {
        const container = document.getElementById('categoryContainer');
        container.innerHTML = ''; // 기존 내용 초기화

        gameList.forEach(game => {
            const item = document.createElement('div');
            item.className = 'category-item';
            item.innerHTML = `<img src="${game.imgUrl}" alt="${game.name}" title="${game.name}" />`;
            // 클릭 시 선택 처리 및 해당 게임의 상품 목록 API 호출
            item.onclick = function() {
                // 모든 게임 항목에서 'selected' 클래스 제거 후, 클릭한 항목에 추가
                document.querySelectorAll('.category-item').forEach(el => el.classList.remove('selected'));
                item.classList.add('selected');
                // gameId를 이용해 필터링 API 호출
                filterProductsByGame(game.gameId);
            };
            container.appendChild(item);
        });
    }

    function filterProductsByGame(gameId) {
        document.getElementById("loadingOverlay").style.display = "flex";
        fetch('/products/game/' + gameId)
            .then(response => response.json())
            .then(result => {
                if (result && result.data && result.data.content) {
                    displayProducts(result.data.content);
                } else {
                    console.error('상품 목록 데이터 형식 확인 필요', result);
                }
                document.getElementById("loadingOverlay").style.display = "none";
            })
            .catch(error => {
                console.error('상품 목록 불러오기 에러:', error);
                document.getElementById("loadingOverlay").style.display = "none";
            });
    }

    /**
     * 6. 상품 목록 UI 표시
     */
    function displayProducts(productList) {
        const container = document.getElementById('productContainer');
        container.innerHTML = ''; // 초기화

        if (productList.length === 0) {
            container.innerHTML = '<div style="text-align:center; padding:20px; color:#666;">아직 상품을 준비중이예요</div>';
            return;
        }

        productList.forEach(product => {
            const item = document.createElement('div');
            item.className = 'product-item';
            // 클릭 시 상품 상세 페이지로 이동하는 이벤트 추가
            item.onclick = () => {
                window.location.href = `/product-detail?productId=${product.productId}`;
            };

            item.innerHTML = `
            <div class="product-left">
                <img src="${product.imgUrl}" alt="${product.productName}" />
            </div>
            <div class="product-right">
                <div><strong>${product.productName}</strong></div>
                <div>${product.price}원</div>
            </div>
        `;
            container.appendChild(item);
        });
    }



    function setActiveFilter(filterType) {
        const allButton = document.getElementById('allButton');
        const popularButton = document.getElementById('popularButton');
        if (filterType === 'all') {
            allButton.classList.add('active');
            popularButton.classList.remove('active');
            loadProducts();
        } else if (filterType === 'popular') {
            popularButton.classList.add('active');
            allButton.classList.remove('active');
            loadPopularProducts();
        }
    }
</script>
</body>
</html>
