<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>채팅방 목록</title>
    <link rel="stylesheet" th:href="@{/css/common.css}" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <style>
        .chatroom-box {
            display: flex;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        .profile-img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #ddd;
            margin-right: 10px;
        }
        .chatroom-box:hover {
            background-color: #f5f5f5;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="inner-con">
        <h2>채팅방 목록</h2>
        <div id="chatroomTableBody">
            <!-- 채팅방 목록이 여기에 채워집니다 -->
        </div>
    </div>
    <!-- 하단 공통 메뉴 -->
    <div th:replace="fragments :: main-nav"></div>
</div>

<script>
    function loadChatrooms() {
        fetch("/chats", {
            method: "GET",
            credentials: "include",
            headers: { "Content-Type": "application/json" }
        })
            .then(response => response.json())
            .then(result => {
                // API 응답 구조가 { status, message, data: { content: [...] } } 형식인 경우
                if (result && result.data && Array.isArray(result.data.content)) {
                    populateTable(result.data.content);
                } else {
                    console.error("채팅방 목록을 불러오지 못했습니다: 올바르지 않은 응답 형식");
                }
            })
            .catch(error => {
                console.error("채팅방 목록 조회 에러:", error);
                alert("채팅방 목록을 불러오지 못했습니다.");
            });
    }

    function populateTable(chatrooms) {
        const container = document.getElementById("chatroomTableBody");
        container.innerHTML = "";
        if (chatrooms.length === 0) {
            container.innerHTML = `<div class="no-chatrooms">아직 채팅방이 없습니다.</div>`;
            return;
        }
        chatrooms.forEach(room => {
            const div = document.createElement("div");
            div.classList.add("chatroom-box");
            div.onclick = function() {
                window.location.href = "/chatroom?chatroomId=" + room.chatroomId;
            };
            div.innerHTML = `
        <div class="profile-img">
          <img src="/img/default-img.png" alt="${room.nickname}" style="width: 100%; height: 100%; border-radius: 50%;" />
        </div>
        <div>
          <strong>${room.nickname}</strong><br/>
          <small>${room.lastMessage}</small>
        </div>
        <div style="margin-left:auto;">
          ${room.unreadMessageCount > 0 ? `<span style="color:red;">${room.unreadMessageCount}</span>` : ""}
        </div>
      `;
            container.appendChild(div);
        });
    }

    window.onload = loadChatrooms;
</script>
</body>
</html>
